<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data: yaris-asset:; worker-src blob:;"><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}model-viewer{width:100%;height:100%;background:transparent;pointer-events:none;--poster-color:transparent}</style><script type="module" src="model-viewer.min.js"></script></head><body><model-viewer id="car" src="../models/yaris.glb" camera-orbit="45deg 75deg 1.3m" min-camera-orbit="auto 75deg 1.3m" max-camera-orbit="auto 75deg 1.3m" camera-target="0m 0.190033m 0m" field-of-view="44.36623656deg" min-field-of-view="44.36623656deg" max-field-of-view="44.36623656deg" interaction-prompt="none" disable-zoom disable-pan shadow-intensity="0.5" exposure="1.2" loading="eager"></model-viewer><script>
const car=document.getElementById('car');
window.setYaw=(yaw)=>{if(Number.isFinite(yaw)){car.cameraOrbit=`${((yaw%360)+360)%360}deg 75deg 1.3m`;car.jumpCameraToGoal();}};
car.addEventListener('load',()=>{window.setYaw(45);window.webkit?.messageHandlers.model.postMessage('loaded');});
car.addEventListener('error',()=>window.webkit?.messageHandlers.model.postMessage('failed'));
window.releaseModel=()=>{car.removeAttribute('src');car.remove();};
</script></body></html>
