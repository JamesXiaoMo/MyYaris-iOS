name: myyaris_ios
description: MyYaris private iPhone client for navigation and remote vehicle media APIs.
publish_to: none
version: 0.2.5+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/yaris.png
    - assets/models/yaris.glb
    - assets/model_viewer/
